<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Daymate 단축키 설정</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: #e0e0f0; padding: 24px; user-select: none; }
  h2 { font-size: 16px; margin-bottom: 20px; color: #fff; }
  label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #444; background: #2a2a3e; color: #fff;
    font-size: 14px; outline: none;
  }
  input:focus { border-color: #4B6FFF; }
  input.capturing { border-color: #f0a500; background: #2a2a1e; }
  .hint { font-size: 11px; color: #666; margin-top: 4px; }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; min-width: 0; }
  .row .clear { flex: 0 0 auto; padding: 0 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a3e; color: #aaa; font-size: 12px; font-weight: 600; }
  .row .clear:hover { background: #3a2a2e; color: #f88; }
  .btns { display: flex; gap: 10px; margin-top: 24px; }
  button {
    flex: 1; padding: 10px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .save { background: #4B6FFF; color: #fff; }
  .save:hover { background: #3a5fe0; }
  .cancel { background: #333; color: #aaa; }
  .cancel:hover { background: #444; }
  .msg { font-size: 12px; color: #4caf50; margin-top: 12px; text-align: center; display: none; }
</style>
</head>
<body>
<h2>단축키 설정</h2>

<label>새 메모 (메모 탭에서 바로 쓰기)</label>
<div class="row"><input id="memo" type="text" placeholder="클릭 후 키 조합을 누르세요" readonly /><button type="button" class="clear" data-for="memo" title="단축키 지우기">지우기</button></div>
<div class="hint">클릭 후 원하는 키 조합을 누르면 자동 입력됩니다. 필요 없으면 '지우기'(또는 칸에서 Backspace)</div>

<label>간편 메모 (바탕화면 포스트잇)</label>
<div class="row"><input id="quickMemo" type="text" placeholder="클릭 후 키 조합을 누르세요" readonly /><button type="button" class="clear" data-for="quickMemo" title="단축키 지우기">지우기</button></div>

<label>메모 관리자</label>
<div class="row"><input id="search" type="text" placeholder="클릭 후 키 조합을 누르세요" readonly /><button type="button" class="clear" data-for="search" title="단축키 지우기">지우기</button></div>

<label>달력 보기</label>
<div class="row"><input id="calendar" type="text" placeholder="클릭 후 키 조합을 누르세요" readonly /><button type="button" class="clear" data-for="calendar" title="단축키 지우기">지우기</button></div>

<label>메모 검색</label>
<div class="row"><input id="memoSearch" type="text" placeholder="클릭 후 키 조합을 누르세요" readonly /><button type="button" class="clear" data-for="memoSearch" title="단축키 지우기">지우기</button></div>

<div class="btns">
  <button class="cancel" onclick="window.close()">취소</button>
  <button class="save" onclick="save()">저장</button>
</div>
<div class="msg" id="msg">저장됐습니다!</div>

<script>
  const { ipcRenderer } = require('electron');

  ipcRenderer.invoke('get-shortcuts').then(({ memo, calendar, search, quickMemo, memoSearch }) => {
    document.getElementById('memo').value = memo;
    document.getElementById('calendar').value = calendar;
    // 지운 단축키('')는 그대로 비워 두고, 설정한 적 없는 항목만 기본값
    document.getElementById('search').value = search ?? 'Ctrl+Shift+S';
    document.getElementById('quickMemo').value = quickMemo ?? 'Ctrl+Shift+N';
    document.getElementById('memoSearch').value = memoSearch ?? 'Ctrl+Alt+F';
  });

  function toElectronKey(e) {
    const parts = [];
    if (e.ctrlKey) parts.push('Ctrl');
    if (e.shiftKey) parts.push('Shift');
    if (e.altKey) parts.push('Alt');
    if (e.metaKey) parts.push('Meta');
    const ignore = ['Control', 'Shift', 'Alt', 'Meta'];
    if (!ignore.includes(e.key)) {
      const key = e.key.length === 1 ? e.key.toUpperCase() : e.key;
      parts.push(key);
    }
    return parts.length > 1 ? parts.join('+') : null;
  }

  document.querySelectorAll('input[type=text]').forEach(input => {
    input.addEventListener('focus', () => {
      input.classList.add('capturing');
      input.placeholder = '키 조합을 누르세요...';
    });
    input.addEventListener('blur', () => {
      input.classList.remove('capturing');
      input.placeholder = '클릭 후 키 조합을 누르세요';
    });
    input.addEventListener('keydown', e => {
      e.preventDefault();
      if ((e.key === 'Backspace' || e.key === 'Delete') && !e.ctrlKey && !e.shiftKey && !e.altKey) { input.value = ''; return; }
      const combo = toElectronKey(e);
      if (combo) input.value = combo;
    });
  });

  document.querySelectorAll('.clear').forEach(btn => {
    btn.addEventListener('click', () => { document.getElementById(btn.dataset.for).value = ''; });
  });

  function save() {
    const memo = document.getElementById('memo').value.trim();
    const calendar = document.getElementById('calendar').value.trim();
    const search = document.getElementById('search').value.trim();
    const quickMemo = document.getElementById('quickMemo').value.trim();
    const memoSearch = document.getElementById('memoSearch').value.trim();
    const used = [memo, calendar, search, quickMemo, memoSearch].filter(Boolean);
    if (new Set(used).size < used.length) { alert('같은 단축키를 두 곳에 쓸 수 없어요.'); return; }
    ipcRenderer.invoke('set-shortcuts', { memo, calendar, search, quickMemo, memoSearch }).then(ok => {
      if (ok) {
        document.getElementById('msg').style.display = 'block';
        setTimeout(() => window.close(), 800);
      } else {
        alert('유효하지 않은 단축키입니다. 다시 입력해주세요.');
      }
    });
  }
</script>
</body>
</html>
